<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rubik's Cube</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: white; font-family: 'Courier New', Courier, monospace; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 8px;
      line-height: 1.6;
    }
    #speedSlider { vertical-align: middle; }
  </style>
</head>
<body>
  <div id="ui">
    <div>spin speed: <input id="speedSlider" type="range" min="0" max="0.03" step="0.001" value="0"></div>
    <div>turn a layer: <b>U D L R F B</b> (hold Shift to reverse)</div>
  </div>

  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(6, 6, -8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;


    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const spacing = 1.05;
    const rubiksCube = new THREE.Group();
    const cubelets = [];

    const COLORS = {
      right: 0xDC143C, left: 0xBD4648,   // +x red, -x orange
      top: 0xFCE47A,   bottom: 0xF2F0EF, // +y yellow, -y white
      front: 0x14DC50, back: 0x2A2D8A,   // +z green, -z blue
      inner: 0x111111
    };


    function makeMaterials(x, y, z) {
      return [
        new THREE.MeshStandardMaterial({ color: x === 1  ? COLORS.right  : COLORS.inner }),
        new THREE.MeshStandardMaterial({ color: x === -1 ? COLORS.left   : COLORS.inner }),
        new THREE.MeshStandardMaterial({ color: y === 1  ? COLORS.top    : COLORS.inner }),
        new THREE.MeshStandardMaterial({ color: y === -1 ? COLORS.bottom : COLORS.inner }),
        new THREE.MeshStandardMaterial({ color: z === 1  ? COLORS.front  : COLORS.inner }),
        new THREE.MeshStandardMaterial({ color: z === -1 ? COLORS.back   : COLORS.inner }),
      ];
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const geometry = new THREE.BoxGeometry(1, 1, 1);
          const materials = makeMaterials(x, y, z);
          const cubelet = new THREE.Mesh(geometry, materials);
          cubelet.position.set(x * spacing, y * spacing, z * spacing);
          cubelet.userData.gridPos = { x, y, z };
          rubiksCube.add(cubelet);
          cubelets.push(cubelet);
        }
      }
    }
    scene.add(rubiksCube);


    let rotationSpeed = 0;
    document.getElementById('speedSlider').addEventListener('input', e => {
      rotationSpeed = parseFloat(e.target.value);
    });


    let isTurning = false;

    function rotateLayer(axis, layerValue, direction) {
      if (isTurning) return;
      isTurning = true;


      const layerCubelets = cubelets.filter(c => c.userData.gridPos[axis] === layerValue);


      const localAxis = new THREE.Vector3(
        axis === 'x' ? 1 : 0, axis === 'y' ? 1 : 0, axis === 'z' ? 1 : 0
      );
      const worldAxis = localAxis.applyQuaternion(rubiksCube.quaternion).normalize(); //acount for the cube's tilt when turning

      const pivot = new THREE.Group();
      scene.add(pivot);
      layerCubelets.forEach(c => pivot.attach(c));

      const targetAngle = direction * Math.PI / 2;
      const duration = 250; // ms
      const start = performance.now();
      let appliedSoFar = 0;

      function animateTurn(now) {
        const t = Math.min((now - start) / duration, 1);
        const angleNow = targetAngle * t;

        pivot.rotateOnWorldAxis(worldAxis, angleNow - appliedSoFar);
        appliedSoFar = angleNow;

        if (t < 1) {
          requestAnimationFrame(animateTurn);
        } else {

          pivot.updateMatrixWorld();

          layerCubelets.forEach(c => {
            rubiksCube.attach(c);

            const { x, y, z } = c.userData.gridPos;
            let nx = x, ny = y, nz = z; // 90° 2D rotation applied to the two axes perpendicular to the turn
            if (axis === 'x') { ny = -direction * z; nz = direction * y; }
            if (axis === 'y') { nx = direction * z;  nz = -direction * x; }
            if (axis === 'z') { nx = -direction * y; ny = direction * x; }
            c.userData.gridPos = { x: Math.round(nx), y: Math.round(ny), z: Math.round(nz) };
          });

          scene.remove(pivot);
          isTurning = false;
        }
      }
      requestAnimationFrame(animateTurn);
    }


    const KEY_MAP = {
      u: ['y', 1], d: ['y', -1],
      r: ['x', 1], l: ['x', -1],
      f: ['z', 1], b: ['z', -1],
    };
    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (KEY_MAP[key]) {
        const [axis, layerValue] = KEY_MAP[key];
        const direction = e.shiftKey ? -1 : 1;
        rotateLayer(axis, layerValue, direction);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!isTurning) {
        rubiksCube.rotation.y += rotationSpeed;
        rubiksCube.rotation.x += rotationSpeed * 0.7;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
